<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴宠有方 - 宠物档案</title>
<link rel="stylesheet" href="css/宠物档案.css">
<script src="js/宠物档案.js"></script>

</head>
<body>
    <div class="page-wrap">
        <header>
            <div class="logo">
                <div class="logo-icon"></div>
                <span>伴宠有方</span>
            </div>
            <nav>
                <a href="index.html">首页</a>
                <a href="1.html" class="active">宠物档案</a>
                <a href="vaccine-cal.html">免疫日历</a>
                <a href="feed-record.html">每日喂食</a>
                <a href="bill.html">日常账本</a>
                <a href="wiki.html">养护百科</a>
            </nav>
            <div class="header-right">
                <a class="login-link" href="#">登录 / 注册</a>
                <button class="btn-dark">创建档案</button>
            </div>
        </header>

        <div class="container">
            <h2 class="page-title">我的宠物档案</h2>
            <p class="page-desc">记录小动物基础信息、生日、种类、体重，一站式管理它的资料</p>
            <div class="card-wrap" id="petWrap">
                <div class="pet-card add-card" id="addPetBtn">
                    <div class="plus">+</div>
                    <div>添加新宠物</div>
                </div>
            </div>
        </div>

        <div class="mask" id="mask">
            <div class="form-box">
                <h3 id="formTitle">添加宠物信息</h3>
                <div class="form-item">
                    <label>宠物名字</label>
                    <input type="text" id="petName" placeholder="例如：元宝、多多">
                </div>
                <div class="form-item">
                    <label>品种/种类</label>
                    <input type="text" id="petBreed" placeholder="例如：布偶猫、金毛、泰迪、英短、橘猫">
                </div>
                <div class="form-item">
                    <label>生日</label>
                    <input type="date" id="petBirth">
                </div>
                <div class="form-item">
                    <label>性别</label>
                    <select id="petGender">
                        <option value="公">公</option>
                        <option value="母">母</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>体重(kg)</label>
                    <input type="number" step="0.1" id="petWeight" placeholder="例如：4.5">
                </div>
                <div class="form-btn-group">
                    <button class="btn-cancel" id="cancelBtn">取消</button>
                    <button class="btn-submit" id="submitBtn">保存</button>
                </div>
            </div>
        </div>

        <input type="file" id="avatarInput" accept="image/*">
    </div>

    <!-- 外部JS引入，放在body末尾 -->
    <script src="js/pet.js"></script>
</body>
</html>
